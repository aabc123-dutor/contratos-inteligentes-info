<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de contacto - Smart Lease</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon_hexagono_transparente.png">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F5F7FA;
      padding: 40px;
      color: #222831;
    }
    .form-container {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #214B8C;
    }
    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      margin-top: 20px;
      background-color: #29B3A4;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #239f91;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Contáctanos</h1>
      <form class="formcarryForm" action="https://formcarry.com/s/MFo1Hzz47DD" method="POST" enctype="multipart/form-data">

      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required>

      <label for="subject">Asunto</label>
      <input type="text" id="subject" name="subject" required>

      <label for="message">Mensaje</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Enviar mensaje</button>
  </div>
  <script>
  $(function () {
    $(".formcarryForm").submit(function (e) {
      e.preventDefault();
      var href = $(this).attr("action");
      $.ajax({
        type: "POST",
        url: href,
        data: new FormData(this),
        dataType: "json",
        processData: false,
        contentType: false,
        success: function (response) {
          if (response.status == "success") {
            window.location.href = "gracias_contacto.html";
          } else if (response.code === 422) {
            alert("Faltan campos obligatorios.");
            $.each(response.errors, function (key) {
              $('[name="' + key + '"]').addClass('formcarry-field-error');
            });
          } else {
            alert("Ocurrió un error: " + response.message);
          }
        },
        error: function (jqXHR) {
          const errorObject = jqXHR.responseJSON;
          alert("Error: " + errorObject.title + ": " + errorObject.message);
        }
      });
    });
  });
</script>
</body>
</html>
